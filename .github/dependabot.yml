version: 2
updates:
  # Rust crate 依賴
  - package-ecosystem: cargo
    directory: "/hardvault"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-patch:
        update-types:
          - patch

  # GitHub Actions workflow 依賴
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
