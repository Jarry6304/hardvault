version: 2
updates:
  # Rust crate 依賴
  - package-ecosystem: cargo
    directory: "/hardvault"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-patch:
        update-types:
          - patch
    # 不要自動開 major 升級 PR（通常有 breaking change，需要手動評估）
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # GitHub Actions workflow 依賴
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    # 同上：actions 的 major 升級也手動處理
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
