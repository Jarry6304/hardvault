name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust-lint:
    name: Rust fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hardvault

      - name: cargo fmt --check
        working-directory: hardvault
        run: cargo fmt --all -- --check

      - name: cargo clippy
        working-directory: hardvault
        run: cargo clippy --all-targets --all-features -- -D warnings

  cargo-audit:
    name: cargo audit (CVE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hardvault
          key: audit

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        working-directory: hardvault
        run: cargo audit --deny warnings

  rust-test:
    name: Rust test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hardvault

      - name: cargo build
        working-directory: hardvault
        run: cargo build --verbose

      - name: cargo test
        working-directory: hardvault
        run: cargo test --verbose

  dotnet-sample:
    name: .NET sample e2e
    runs-on: ubuntu-latest
    needs: rust-test
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hardvault

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install hardvault CLI
        working-directory: hardvault
        run: cargo install --path . --locked

      - name: Verify hardvault on PATH
        run: hardvault --version

      - name: Generate dummy HARDVAULT_MASTER_KEY for CI
        run: |
          KEY=$(hardvault keygen 2>/dev/null | head -1 | tr -d '[:space:]')
          echo "HARDVAULT_MASTER_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Prepare secrets.toml from example
        working-directory: sample/Hardvault.Sample
        run: cp secrets.toml.example secrets.toml

      - name: dotnet build sample
        working-directory: sample/Hardvault.Sample
        run: dotnet build --verbosity normal

      - name: dotnet run sample (verify decryption works)
        working-directory: sample/Hardvault.Sample
        run: |
          OUTPUT=$(dotnet run --no-build)
          echo "$OUTPUT"
          # 驗證關鍵輸出
          echo "$OUTPUT" | grep -q "SCAN_CRON" || { echo "missing SCAN_CRON"; exit 1; }
          echo "$OUTPUT" | grep -q "LINE_TOKEN" || { echo "missing LINE_TOKEN"; exit 1; }
          echo "$OUTPUT" | grep -q "length=24" || { echo "LINE_TOKEN length mismatch (expected 24 for 'ey_demo_token_replace_me')"; exit 1; }

      - name: Verify missing key fails fast
        working-directory: sample/Hardvault.Sample
        run: |
          unset HARDVAULT_MASTER_KEY
          if dotnet run --no-build 2>&1; then
            echo "expected failure but got success"
            exit 1
          fi
          echo "✓ correctly failed without HARDVAULT_MASTER_KEY"

  all-checks-pass:
    name: All checks pass
    runs-on: ubuntu-latest
    needs: [rust-lint, cargo-audit, rust-test, dotnet-sample]
    steps:
      - run: echo "All CI checks passed"
